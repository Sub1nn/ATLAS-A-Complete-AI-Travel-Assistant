services:
  mongo:
    image: mongo:7
    container_name: atlas-mongo
    restart: unless-stopped
    volumes:
      - atlas-mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - atlas-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/atlas_travel
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "4000:4000"
    depends_on:
      - mongo
    networks:
      - atlas-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_NAME: ATLAS Travel Assistant
        VITE_APP_VERSION: 1.0.0
    container_name: atlas-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - atlas-network

networks:
  atlas-network:
    driver: bridge

volumes:
  atlas-mongo-data:
